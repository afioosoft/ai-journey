name: Deploy helper to Cloudflare

# Runs when a change to the helper is merged into main (merging the pull request is the approval),
# or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths:
      - "helper/worker.js"
      - "helper/wrangler.toml"
      - ".github/workflows/deploy-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-helper
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: helper
          command: deploy
